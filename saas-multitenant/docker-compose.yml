services:

  # ============================================================
  # Backend — Express/Node.js
  # ============================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: despachante-backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      NODE_ENV: production
    expose:
      - "5000"
    networks:
      - chronostek-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================
  # Nginx — Reverse proxy + SSL termination
  # ============================================================
  nginx:
    image: nginx:1.27-alpine
    container_name: despachante-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/api.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-certs:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - chronostek-network
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # ============================================================
  # Certbot — Emissão/renovação automática de certificado SSL
  # Executar manualmente: docker compose run --rm certbot
  # ============================================================
  certbot:
    image: certbot/certbot:latest
    container_name: despachante-certbot
    volumes:
      - certbot-certs:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    # Emite o certificado inicial (somente executar uma vez)
    command: >
      certonly --webroot
      --webroot-path=/var/www/certbot
      --email admin@chronostek.com.br
      --agree-tos
      --no-eff-email
      -d api-despachante.chronostek.com.br

volumes:
  certbot-certs:
    name: chronostek-certbot-certs
  certbot-webroot:
    name: chronostek-certbot-webroot

networks:
  chronostek-network:
    external: true
